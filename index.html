<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mohit Banduni &middot; referrer funnel</title>
<style>
  :root{--ink:#14181f;--paper:#f7f7f5;--line:#e4e3de;--muted:#6b7078;--accent:#0b5f4e;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;}
  *{box-sizing:border-box}
  body{margin:0;padding:40px 20px 64px;background:var(--paper);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  .wrap{max-width:520px;margin:0 auto}
  header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:24px}
  h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px;font-weight:650}
  .stamp{font:12px/1 var(--mono);color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 16px;text-align:center}
  .stat .v{font:650 32px/1 var(--mono);letter-spacing:-.03em}
  .stat:last-child .v{color:var(--accent)}
  .stat .k{margin-top:8px;font:600 10px/1.3 var(--mono);letter-spacing:.07em;
    text-transform:uppercase;color:var(--muted)}
  .tags,.empty{font-size:13px;color:var(--muted);margin:18px 0 0}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:14px 16px}
  code{font:400 12px/1 var(--mono);background:#eeeeea;padding:2px 5px;border-radius:4px;color:var(--ink)}
  @media(max-width:440px){.stats{grid-template-columns:1fr}.stat{display:flex;
    align-items:baseline;justify-content:space-between;text-align:left;padding:14px 16px}
    .stat .k{margin:0}}
</style></head><body><div class="wrap">

<header>
  <h1>Mohit Banduni</h1>
  <div class="stamp">Referrer funnel &middot; 19 Aug 2026, 02:02 pm IST</div>
</header>

<div class="stats">
  <div class="stat"><div class="v">48</div><div class="k">Page views</div></div>
  <div class="stat"><div class="v">4</div><div class="k">Leads</div></div>
  <div class="stat"><div class="v">0</div><div class="k">Onboardings</div></div>
</div>

<p class="tags">Matched on <code>Mohit Banduni</code></p>

</div></body></html>
